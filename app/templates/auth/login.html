{% extends "base.html" %}

{% block title %}Sign In – PavePulse{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); border: 1px solid var(--border-medium);">
    <div class="card-header" style="justify-content: center; text-align: center; border-bottom: 1px solid var(--border-subtle);">
      <div>
        <h2 class="card-title" style="font-size: 1.6rem; color: #ffffff;">Access PavePulse</h2>
        <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 0.35rem;">
          Sign in to report road hazards, review risk scores, or dispatch repairs.
        </p>
      </div>
    </div>

    <!-- Quick Demo Logins Banner -->
    <div style="background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.5rem;">
      <div style="font-weight: 700; color: var(--accent-cyan); font-size: 0.85rem; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.4rem;">
        <span>⚡ Quick 1-Click Demo Logins:</span>
      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-sm btn-outline" style="flex: 1;" onclick="fillLogin('admin@pavepulse.org', 'Admin@123')">🔑 Admin</button>
        <button type="button" class="btn btn-sm btn-outline" style="flex: 1;" onclick="fillLogin('officer@pavepulse.org', 'Officer@123')">🛠️ Officer</button>
        <button type="button" class="btn btn-sm btn-outline" style="flex: 1;" onclick="fillLogin('citizen@pavepulse.org', 'Citizen@123')">👤 Citizen</button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ email or '' }}" required placeholder="your.email@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" name="remember" value="1" style="accent-color: var(--accent-cyan);"> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
      Need a new citizen account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Create one here &rarr;</a>
    </div>
  </div>
</div>

<script>
  function fillLogin(email, pwd) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pwd;
  }
</script>
{% endblock %}
