server {
    listen 80;
    server_name _; # Catch-all for EC2 Public IP or configured domain

    # Max upload size for photographs (matches 10MB limit in app)
    client_max_body_size 12M;

    # Static file serving directly via Nginx for high performance
    location /static/ {
        alias /home/ubuntu/pavepulse/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all dynamic requests to Flask / Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}
